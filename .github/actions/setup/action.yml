name: Setup
description: Checkout-adjacent setup — pnpm, Node, and a warm dependency cache.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      # Version comes from `packageManager` in package.json, so it can never
      # drift from what developers run locally.

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # `--frozen-lockfile` fails rather than silently resolving a different tree
      # than the one that was reviewed.
      run: pnpm install --frozen-lockfile

    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
        restore-keys: |
          next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
