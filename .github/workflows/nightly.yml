name: Nightly

on:
  # Nightly schedule temporarily disabled — trigger manually via workflow_dispatch.
  # schedule:
  #   # 02:00 Europe/Kyiv, comfortably after the working day.
  #   - cron: '0 23 * * *'
  workflow_dispatch:

env:
  NEXT_PUBLIC_API_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3001
  NEXT_PUBLIC_ENV: development

jobs:
  # The PR run is chromium + webkit sharded for latency. This is the wide pass:
  # every browser project, no sharding, no retries hiding flake.
  e2e-full:
    name: Full E2E matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps

      # `--retries 0` is the point: a test that only passes on retry is flaky,
      # and the nightly run is where that should be visible rather than hidden.
      - run: pnpm test:e2e --retries 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Renovate handles version bumps; this catches an advisory published against a
  # version we are already pinned to, which no bump PR would surface.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm audit --audit-level moderate

  # Field data comes from web-vitals in production; this is the lab counterpart,
  # so a regression is attributable to a commit rather than to traffic mix.
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm build

      - name: Run Lighthouse CI
        run: |
          pnpm dlx @lhci/cli@0.14.x autorun \
            --collect.startServerCommand='pnpm start' \
            --collect.url=http://localhost:3001 \
            --collect.url=http://localhost:3001/uk \
            --collect.numberOfRuns=3 \
            --upload.target=filesystem \
            --upload.outputDir=.lighthouseci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

  # A scheduled workflow fails silently unless something says so out loud.
  report:
    name: Nightly result
    runs-on: ubuntu-latest
    needs: [e2e-full, audit, lighthouse]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
      - run: echo "Nightly checks passed."
