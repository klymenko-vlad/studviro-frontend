name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The env schema refuses to build without these; they are not secrets.
  NEXT_PUBLIC_API_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3001
  NEXT_PUBLIC_ENV: development
  STORAGE_PUBLIC_URL: http://localhost:9000

jobs:
  # Installs once and warms the store cache; every other job reuses it.
  setup:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      # FSD structure, import cycles, unreferenced code.
      - run: pnpm arch
      - run: pnpm cycles
      - run: pnpm deadcode
      # Catches a key added to en.json but not uk.json — the type-level key
      # checking cannot see that, and it falls back silently at runtime.
      - run: pnpm i18n:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Unit & component tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  api-contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The spec lives in the backend repo; regenerating the client from it and
      # diffing is what turns a breaking backend change into a red frontend PR
      # instead of a runtime failure.
      - name: Check out the backend spec
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/studviro-backend
          path: .backend-spec
          # Public repos need no token; set one here for a private backend.
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
        continue-on-error: true
        id: backend

      - name: Regenerate and diff
        if: steps.backend.outcome == 'success'
        run: |
          OPENAPI_SOURCE=.backend-spec/openapi.json pnpm api:generate
          git diff --exit-code -- src/shared/api/generated \
            || { echo "::error::Generated API client is stale. Run 'pnpm api:generate' and commit the result."; exit 1; }

      - name: Skipped
        if: steps.backend.outcome != 'success'
        run: echo "::warning::Backend spec unavailable; contract check skipped."

  build:
    name: Build & bundle budget
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Fails the PR when the shared JS payload crosses the budget in .size-limit.json.
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          # The build cache is megabytes of it and useless to `next start`.
          path: |
            .next/
            !.next/cache
          # `.next` is a dotted path, and upload-artifact v4 drops hidden files
          # by default — without this the step "succeeds" having uploaded
          # nothing and every E2E shard fails on a missing artifact.
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The cache holds the browser binaries, never the apt packages they link
      # against, so the system libraries have to be installed on every run — a
      # cache hit that skipped this left WebKit unable to find libevent.
      - run: pnpm exec playwright install-deps chromium webkit

      - run: pnpm exec playwright install chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      # The blob reporter emits a mergeable fragment; the merge job below turns
      # the per-shard fragments back into one navigable report.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Without this, a sharded run leaves two half-reports and no way to read either.
  e2e-report:
    name: Merge E2E reports
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - run: pnpm exec playwright merge-reports --reporter html all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # One required check to protect the branch with, instead of ten.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, api-contract, build, e2e, e2e-report]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
